services:
  portal:
    build: .
    env_file: .env
    environment:
      NODE_ROLE: portal
      NODE_ID: portal
    ports:
      - "8080:8000"

  clinic0:
    build: .
    env_file: .env
    environment:
      NODE_ROLE: clinic
      NODE_ID: clinic0
      DATABASE_URL: postgres://clinic:clinic@db0:5432/clinic
    depends_on: [db0]

  db0:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
    volumes:
      - pgdata0:/var/lib/postgresql/data

  clinic1:
    build: .
    env_file: .env
    environment:
      NODE_ROLE: clinic
      NODE_ID: clinic1
      DATABASE_URL: postgres://clinic:clinic@db1:5432/clinic
    depends_on: [db1]

  db1:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
    volumes:
      - pgdata1:/var/lib/postgresql/data

volumes:
  pgdata0:
  pgdata1: