{% extends "portal/base.html" %}

{% block title %}Заявка — Портал{% endblock %}

{% block content %}
<div class="container">
    <div class="left-panel">
        <h2>Список</h2>
        <div class="list-box">
            {% for record in records %}
                <div class="list-item">
                    <small>{{ record.diagnosis }}</small>
                </div>
            {% empty %}
                <p>Список пуст</p>
            {% endfor %}
        </div>
    </div>

   <div class="right-panel">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="patient_name">Пациент</label>
                <input type="text" id="patient_name" name="patient_name" class="form-control" placeholder="Введите имя" required>
            </div>

            <div class="form-group">
                <label for="diagnosis">Диагноз</label>
                <input type="text" id="diagnosis" name="diagnosis" class="form-control" placeholder="Введите диагноз" required>
            </div>

            <button type="submit" class="btn-submit">Добавить</button>
        </form>
    </div>
</div>
{% endblock %}
