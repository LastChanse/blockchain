{% extends "portal/base.html" %}

{% block title %}Заявка — Портал{% endblock %}

{% block content %}
<h2>Подача заявки</h2>
<form>
    <label>Клиника:
        <input type="text" name="clinic_id" required>
    </label>
    <label>Комментарий:
        <textarea name="comment" rows="4" style="resize: vertical; min-width: 100%; max-width: 100%;"></textarea>
    </label>
    <button type="submit">Отправить</button>
</form>
{% endblock %}
